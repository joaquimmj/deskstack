# Publishes site/ to GitHub Pages (https://joaquimmj.github.io/deskstack/) on every push to main that touches it.
# One-time setup by the repo owner: Settings → Pages → Source: GitHub Actions.

name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the pages are built from the current content
        run: |
          python3 site/src/build.py
          git diff --exit-code site/index.html site/fr/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
