name: PyPI

# Publishes deskstack-check when a GitHub release is published. Uses PyPI trusted publishing (no token):
# on pypi.org, add a pending publisher for project "deskstack-check" with owner joaquimmj, repository deskstack,
# workflow pypi.yml and environment pypi. Until that is done, this job fails at the upload step and changes nothing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet build==1.2.2 && python -m build checker
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: checker/dist
