name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Offline snapshot from fixtures, then check the Worker bundles (no deploy).
      - run: npx tsx scripts/build-snapshot.ts --fixtures test/fixtures/sec
      - run: npx wrangler deploy --dry-run --outdir dist

  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 et_xmlfile==2.0.0 pytest==8.3.3
      # Includes: golden.json is current, vendored plugin copies are current, the e2e grader and the differential logic.
      - run: python -m pytest -q checker/tests

  # The deskstack-check GitHub Action (action.yml), run from this checkout on the committed examples.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          files: examples/*/model.xlsx
          fail-on: blocker
      - id: strict
        uses: ./
        continue-on-error: true
        with:
          files: examples/errors-caught/model.xlsx
          fail-on: major
      - name: The planted placeholder fails at "major"
        env:
          PASSED: ${{ steps.strict.outputs.passed }}
        run: test "$PASSED" = "false"
