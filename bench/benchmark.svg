<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="deskstack benchmark: wrong reported figures per setup">
<style>
svg{--bg:#ffffff;--fg:#1f2328;--mute:#59636e;--track:#eef0f3;--bad:#cf222e;}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--fg:#e6edf3;--mute:#9198a1;--track:#21262d;--bad:#f85149;}}
.bg{fill:var(--bg)}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}
.t{font-size:16px;font-weight:600}.h{font-size:13px;font-weight:600}.l,.v{font-size:13px}
.n{font-size:11px;fill:var(--mute)}.track{fill:var(--track)}.bad{fill:var(--bad)}.vbad{fill:var(--bad);font-weight:600}
</style>
<rect class="bg" width="900" height="340" rx="8"/>
<text class="t" x="16" y="30">Wrong reported figures, by setup</text>
<text class="h" x="16" y="58">DCF, 50 companies</text>
<text class="l" x="16" y="92">A: web search only</text>
<rect class="track" x="300" y="78" width="260" height="18" rx="3"/>
<rect class="bad" x="300" y="78" width="226.9" height="18" rx="3"/>
<text class="v vbad" x="572" y="92">20 of 573 wrong (3.5%) · $0.23 each</text>
<text class="l" x="16" y="122">B: deskstack data</text>
<rect class="track" x="300" y="108" width="260" height="18" rx="3"/>
<text class="v" x="572" y="122">0 of 593 wrong (0.0%) · $0.07 each</text>
<text class="l" x="16" y="152">C: deskstack + associate + VP review + fix</text>
<rect class="track" x="300" y="138" width="260" height="18" rx="3"/>
<text class="v" x="572" y="152">0 of 606 wrong (0.0%) · $0.10 each</text>
<text class="h" x="16" y="196">Comps, 50 companies</text>
<text class="l" x="16" y="230">A: web search only</text>
<rect class="track" x="300" y="216" width="260" height="18" rx="3"/>
<rect class="bad" x="300" y="216" width="233.7" height="18" rx="3"/>
<text class="v vbad" x="572" y="230">16 of 445 wrong (3.6%) · $0.56 each</text>
<text class="l" x="16" y="260">B: deskstack data</text>
<rect class="track" x="300" y="246" width="260" height="18" rx="3"/>
<text class="v" x="572" y="260">0 of 1,021 wrong (0.0%) · $0.17 each</text>
<text class="l" x="16" y="290">C: deskstack + associate + VP review + fix</text>
<rect class="track" x="300" y="276" width="260" height="18" rx="3"/>
<text class="v" x="572" y="290">0 of 1,010 wrong (0.0%) · $0.22 each</text>
<text class="n" x="16" y="324">Reported figures in each AI-built model, read by hand against the filings. Claude Sonnet 5.5. B and C read the data they are scored against.</text>
</svg>
